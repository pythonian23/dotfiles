# This is an example Hyprland config file.
#
# Refer to the wiki for more information.

#
# Please note not all available settings / options are set here.
# For a full list, see the wiki


#env = LIBVA_DRIVER_NAME,nvidia
#env = XDG_SESSION_TYPE,wayland
#env = GBM_BACKEND,nvidia-drm
#env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = WLR_NO_HARDWARE_CURSORS,1
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1


# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=eDP-1,2560x1600,0x0,1
monitor=HDMI-A-2,1920x1080,-1920x0,1,vrr,1
monitor=DP-6,1920x1080,-1920x0,1,vrr,1
monitor=DP-5,1920x1080,-1920x0,1,vrr,1
monitor=,preferred,auto,1

# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch
exec-once = systemctl --user start wm-session.target
exec-once = /usr/libexec/polkit-kde-authentication-agent-1 &
exec-once = dunst &
exec-once = fcitx5 &
exec-once = nm-applet &
exec-once = appimaged &
exec-once = waybar &
# exec-once = hyprpaper &
exec-once = swww-daemon&
exec-once = randswww ~/Pictures/SuperWallpapers/
exec-once = [workspace special:discord silent] discord

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf
source=~/.config/hypr/macchiato.conf

# Some default env vars.
# env = XCURSOR_SIZE,32
env = HYPRCURSOR_THEME,catppuccin-macchiato-mauve
env = HYPRCURSOR_SIZE,32

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_options = caps:escape

    kb_layout = us
    accel_profile=flat
    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    tablet {
        output = eDP-1
        active_area_size = 160, 100
    }
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 2
    gaps_out = 2
    border_size = 2
    col.active_border = $mauve $red 45deg
    col.inactive_border = $crust

    layout = dwindle
}

cursor {
    inactive_timeout = 5
    no_hardware_cursors = true
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 0

    blur {
        enabled = true
        size = 4
        passes = 2
    }
}

animations {
    enabled = true

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = overshot, 0.05, 0.9, 0.1, 1.05


    animation = windowsIn, 1, 3, default
    animation = windowsOut, 1, 3, default
    animation = windowsMove, 1, 2, overshot
    animation = border, 1, 5, default
    animation = fade, 1, 2, default
    animation = fadeDim, 1, 5, default
    animation = workspaces, 1, 2, overshot
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = true # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    new_status = master
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    workspace_swipe = true
    workspace_swipe_fingers = 4
    workspace_swipe_distance = 100
    workspace_swipe_invert = false
    workspace_swipe_forever = true
}

misc {
    disable_hyprland_logo=true
    disable_splash_rendering=true

    enable_swallow = true
    swallow_regex = ^(XTerm)$
}

# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
windowrule = suppressevent maximize, ^(.*)$
windowrulev2 = workspace special:discord silent, class:(discord)
windowrulev2 = tile, class:(libresprite)
windowrulev2 = float, class:(kdesu)
windowrulev2 = suppressevent fullscreen, class:(zoom)
windowrulev2 = float, class:(firefox),title:(Picture-in-Picture)
windowrulev2 = pin, class:(firefox),title:(Picture-in-Picture)
windowrulev2 = noblur, class:(org.oe-f.openboard)
windowrulev2 = float, class:(org.oe-f.openboard)

# workspace=special:terminal, gapsout:96, gapsin:16, on-created-empty: __NV_PRIME_RENDER_OFFLOAD=1 __GLX_VENDOR_LIBRARY_NAME=nvidia cool-retro-term
workspace=special:terminal, gapsout:96, gapsin:16, on-created-empty: kitty
# workspace=special:python, gapsout:96, gapsin:16, on-created-empty: __NV_PRIME_RENDER_OFFLOAD=1 __GLX_VENDOR_LIBRARY_NAME=nvidia cool-retro-term -e venv-ipython3
workspace=special:python, gapsout:96, gapsin:16, on-created-empty: [focus] kitty -e venv-ipython3
workspace=special:discord, gapsout:96, on-created-empty:[silent] discord

layerrule = blur, waybar
layerrule = blur, launcher
layerrule = blur, notifications

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = $mainMod SHIFT, H, swapwindow, l
bind = $mainMod SHIFT, L, swapwindow, r
bind = $mainMod SHIFT, K, swapwindow, u
bind = $mainMod SHIFT, J, swapwindow, d


# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod, PRIOR, focusmonitor, l
bind = $mainMod, NEXT, focusmonitor, r
bind = $mainMod, LEFT, workspace, -1
bind = $mainMod, RIGHT, workspace, +1

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10
bind = $mainMod SHIFT, PRIOR, movecurrentworkspacetomonitor, l
bind = $mainMod SHIFT, NEXT, movecurrentworkspacetomonitor, r
bind = $mainMod SHIFT, LEFT, movetoworkspacesilent, -1
bind = $mainMod SHIFT, RIGHT, movetoworkspacesilent, +1

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# System
bind = $mainMod, ESCAPE, exec, printf "%s\n" "🔌 Power Off" "♻️ Restart" "⚠️ Suspend" "💤 Hibernate" "⛔ Log Out" | tofi | awk '{ print $1 }' | sed -e "s/🔌/systemctl poweroff/ ; s/♻️/systemctl reboot/ ; s/⚠️/systemctl suspend/ ; s/💤/systemctl hibernate/ ; s/⛔/hyprctl dispatch exit/" | xargs hyprctl dispatch exec
bind = $mainMod, P, pin,
bind = $mainMod SHIFT, P, pseudo,
bind = $mainMod, S, togglesplit, # dwindle
bind = $mainMod, F, togglefloating,
bind = $mainMod SHIFT, F, fullscreen,
bind = $mainMod, Q, killactive,

# Util
bind = $mainMod, RETURN, exec, tofi-drun --drun-launch=true
bind = $mainMod, Period, exec, bemoji -nDall
bind = $mainMod, R, exec, $(tofi-run --require-match=false)
bind = $mainMod, G, exec, __NV_PRIME_RENDER_OFFLOAD=1 __GLX_VENDOR_LIBRARY_NAME=nvidia tofi-drun --drun-launch=true
bind = ,Print, exec, hyprshot -m region --clipboard-only
bind = $mainMod, Print, exec, hyprshot -m output --clipboard-only
bind = $mainMod, O, exec, hyprpicker -arf hex
# # MPD
bind = $mainMod, M, exec, printf "%s\n" "🧹 Clear" "⏯️ Play/Pause" "⏮️ Previous" "⏭️ Next" "🔇 Mute" "🔈 Low Volume" "🔉 Medium Volume" "🔊 High Volume" "📢 Max Volume" "🎲 Random" | tofi --prompt-text "🎸 " | awk '{ print $1 }' | sed -e "s/🧹/clear/ ; s/⏯️/toggle/ ; s/⏮️/prev/ ; s/⏭️/next/ ; s/🔇/volume 0/ ; s/🔈/volume 25/ ; s/🔉/volume 50/ ; s/🔊/volume 75/ ; s/📢/volume 100/ ; s/🎲/random/" | xargs mpc
bind = $mainMod SHIFT, M, exec, mpc list Album | tofi --prompt-text '💿 ' | xargs -I % mpc searchadd Album "%" && mpc play
bind = $mainMod CTRL, M, exec, mpc list Title | tofi --prompt-text '📼 ' | xargs -I % mpc searchadd Title "%" && mpc play
bind = $mainMod CTRL SHIFT, M, exec, mpc playlist | awk '{ print NR " " $0 }' | tofi --prompt-text '🎼 ' | awk '{ print $1 }' | xargs mpc play
# # Volume
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
binde = , XF86AudioLowerVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%-
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioMicMute, exec, pactl set-source-mute 0 toggle
# # Media
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioPlay, exec, playerctl play-pause || mpc toggle
bind = , XF86AudioPause, exec, playerctl play-pause || mpc toggle
bind = , XF86AudioNext, exec, playerctl next
# # Brightness
binde = , XF86MonBrightnessDown, exec, brightnessctl -d intel_backlight s 5%-
binde = , XF86MonBrightnessUp, exec, brightnessctl -d intel_backlight s +5%

# # Scratchpads
bind = $mainMod, T, togglespecialworkspace, terminal
bind = $mainMod, I, togglespecialworkspace, python
bind = $mainMod, D, togglespecialworkspace, discord
bind = $mainMod SHIFT, T, movetoworkspacesilent, special:terminal
bind = $mainMod SHIFT, I, movetoworkspacesilent, special:python
bind = $mainMod SHIFT, D, movetoworkspacesilent, special:discord

# Apps
bind = $mainMod, SPACE, exec, emacs
bind = $mainMod, W, exec, firefox
bind = $mainMod, C, exec, __NV_PRIME_RENDER_OFFLOAD=1 __GLX_VENDOR_LIBRARY_NAME=nvidia cool-retro-term
bind = $mainMod SHIFT, C, exec, kitty

# Key Input‽‽‽
bind = $mainMod SHIFT, SLASH, exec,  wl-copy ‽
